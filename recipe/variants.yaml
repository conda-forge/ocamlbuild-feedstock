c_compiler:
  - if: not unix and x86_64
    then:
      - vs2022
      - gcc
  - if: not unix and arm64
    then:
      - zig

ocaml_compiler:
  - ocaml
ocaml_compiler_version:
  - "5.4.1"

# Uploads from this branch go to a label holding only ocamlbuild, so downstreams can
# list it first in channel_sources without strict priority hiding ocaml from main.
channel_targets:
  - conda-forge ocamlbuild_experimental
