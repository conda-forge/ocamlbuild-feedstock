context:
  build_number: 102
  name: ocamlbuild
  version: 0.16.1

  # ocaml_win-64 ships gcc_* and vs2022_* at the same version/build; name the track.
  c_toolchain: ${{ "" if unix else c_compiler ~ "_*" }}
  library: ${{ "Library/" if not unix else "" }}
  dot: ${{ "./" if unix else "" }}
  m2: ${{ "m2-" if not unix else "" }}

package:
  name: ocamlbuild
  version: ${{ version }}

source:
  url: https://github.com/ocaml/ocamlbuild/archive/${{ version }}.tar.gz
  sha256: 2ba6857f2991b7f69368e8db818b163d31cf5a367f15f5953bf8f01a77b3d4fc

build:
  number: ${{ build_number }}
  string: ${{ c_compiler ~ "_" if not unix }}h${{ hash }}_experimental_${{ build_number }}
  script: build.sh

requirements:
  build:
    - ${{ compiler('ocaml') }}
    - if: not unix and c_compiler == "gcc"
      then:
        - ${{ stdlib("m2w64_c") }}
      else:
        - ${{ stdlib("c") }}
    - ${{ m2 }}make
    # ocaml_win-arm64 < 116 lacks stack probes; Unix.read/write crash.
    - if: win and arm64
      then: ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.* zig_*[build_number=">=116"]
      else: ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.* ${{ c_toolchain }}
    # Every sed/cp/tr/mv call site in build.sh is windows-only.
    - if: not unix
      then:
        - ${{ m2 }}coreutils
        - ${{ m2 }}sed
  run:
    # win-arm64 ocamlbuild is bytecode; it needs ocamlrun at runtime.
    - if: win and arm64
      then: ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.* zig_*[build_number=">=116"]
  run_constraints:
    - if: win and arm64
      then: ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.* zig_*[build_number=">=116"]
      else: ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.* ${{ c_toolchain }}

tests:
  - package_contents:
      strict: true
      bin:
        - ocamlbuild
        # win-arm64 OCaml is bytecode-only: no native artefacts
        - if: not (win and arm64)
          then: ocamlbuild.native
        - if: win and arm64
          then: ocamlbuild.byte
      files:
        - ${{ library }}lib/ocaml/ocamlbuild/META
        - ${{ library }}lib/ocaml/ocamlbuild/ocamlbuild.cmo
        - if: not (win and arm64)
          then: ${{ library }}lib/ocaml/ocamlbuild/ocamlbuild.cmx
        # Object and library extensions follow the windows toolchain: the gcc lane
        # emits .o and .a, the vs2022 lane .obj and .lib, with identical basenames.
        # Glob over the extension rather than branching the block per lane.
        - if: not (win and arm64)
          then: ${{ library }}lib/ocaml/ocamlbuild/ocamlbuild.o*
        - ${{ library }}lib/ocaml/ocamlbuild/ocamlbuild_*.cmi
        - if: not (win and arm64)
          then: ${{ library }}lib/ocaml/ocamlbuild/ocamlbuild_*.cmx
        - if: not (win and arm64)
          then: ${{ library }}lib/ocaml/ocamlbuild/ocamlbuild_*.o*
        - ${{ library }}lib/ocaml/ocamlbuild/ocamlbuildlib*
        - ${{ library }}lib/ocaml/ocamlbuild/ocamlbuildlib.cma
        - if: not (win and arm64)
          then: ${{ library }}lib/ocaml/ocamlbuild/ocamlbuildlib.cmxa
        - ${{ library }}lib/ocaml/ocamlbuild/signatures.cmi
        - ${{ library }}lib/ocaml/ocamlbuild/signatures.cmti
        - ${{ library }}lib/ocaml/ocamlbuild/signatures.mli
        - ${{ library }}share/man/man1/ocamlbuild.1
        # rattler-build packages the win-arm64 test's `files:` here.
        - if: win and arm64
          then: etc/conda/test-files/ocamlbuild/**

  # Cross-compiled platforms: verify binary architecture
  - if: build_platform != target_platform
    then:
      script:
        - if: osx
          then:
            - otool -hv ${CONDA_PREFIX}/bin/ocamlbuild
            - otool -hv ${CONDA_PREFIX}/bin/ocamlbuild.native
        - if: linux
          then:
            - readelf -h ${CONDA_PREFIX}/bin/ocamlbuild
            - readelf -h ${CONDA_PREFIX}/bin/ocamlbuild.native

  # Native platforms: version check
  - if: build_platform == target_platform
    then:
      script:
        - ocamlbuild -version | grep ${{ version }}
        - if: not (win and arm64)
          then: ocamlbuild.native -version | grep ${{ version }}
      requirements:
        run:
          - ${{ m2 }}grep

  # Native platforms: full functional test
  - if: build_platform == target_platform and not (win and arm64)
    then:
      script:
        - if: unix
          then:
            - echo 'let () = print_endline "Hello from ocamlbuild"' > hello.ml
          else:
            - echo let () = print_endline "Hello from ocamlbuild" > hello.ml
        - ocamlbuild hello.native && ${{ dot }}hello.native
        - ocamlbuild -clean
        - ocamlbuild hello.byte && ${{ dot }}hello.byte
      requirements:
        run:
          # MSVC ships no _impl_ package; vs2022_win-64 is the activation package.
          - if: not unix and c_compiler == "vs2022"
            then: vs2022_${{ target_platform }}
            else: ${{ c_compiler }}_impl_${{ target_platform }}
          - ocaml-compiler

  # win-arm64 OCaml is bytecode-only (no ocamlopt)
  - if: win and arm64
    then:
      script:
        - echo let () = print_endline "Hello from ocamlbuild" > hello.ml
        - ocamlbuild hello.byte && hello.byte
        - python testing/test-arch.py "%PREFIX%\Library\bin\ocamlbuild.exe"
      files:
        recipe:
          - testing/test-arch.py
      requirements:
        run:
          - ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.* zig_*[build_number=">=116"]
          - python >=3.9

  # Cross-compiled platforms: limited tests (QEMU constraints)
  - if: linux and (build_platform != target_platform)
    then:
      script:
        - ocamlbuild -documentation
        - echo 'let () = print_endline "Hello from ocamlbuild"' > hello.ml
        - ocamlbuild hello.cmo
      requirements:
        # file has no riscv64/s390x build; take it from the build platform.
        build:
          - file
        run:
          - ocaml-compiler

about:
  homepage: https://ocaml.org/
  license: LGPL-2.0-only
  license_family: LGPL
  license_file: LICENSE
  summary: OCamlbuild is a generic build tool, that has built-in rules for building OCaml library and programs.

  # The remaining entries in this section are optional, but recommended
  description: |
    OCaml is an implementation of the ML language, based on the Caml Light
    dialect extended with a complete class-based object system and a powerful
    module system in the style of Standard ML.

    OCamlbuild was distributed as part of the OCaml distribution for OCaml
    versions between 3.10.0 and 4.02.3. Starting from OCaml 4.03, it is now
    released separately (with its own version numbering).

    You should refer to the OCambuild manual for more informations on how to
    use ocamlbuild.
  documentation: https://github.com/ocaml/ocamlbuild/blob/master/manual/manual.adoc
  repository: https://github.com/ocaml/ocamlbuild

extra:
  recipe-maintainers:
    - dslarm
    - peterjc
    - MementoRC
