# experimental: only the non-unix lanes are built; restore the commented entries to re-enable unix lanes
build_platform: {}
#  linux_ppc64le: linux_64
#  linux_riscv64: linux_64
#  linux_s390x: linux_64
conda_build:
  error_overlinking: true
conda_build_tool: rattler-build
conda_forge_output_validation: true
conda_install_tool: pixi
github:
  branch_name: main
  tooling_branch_name: main
provider:
  linux_64: false
  linux_aarch64: false
  linux_ppc64le: false
  linux_riscv64: false
  linux_s390x: false
  osx_64: false
  osx_arm64: false
#  linux_aarch64: default
#  osx_arm64: default
  win_arm64: default
test: all
